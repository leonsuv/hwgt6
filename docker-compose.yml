services:
  opel-bridge:
    build: .
    container_name: opel-bridge
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      # mock | psacc | stellantis
      OPELBRIDGE_PROVIDER: mock
      # Token fest vorgeben, sonst wuerfelt die Bridge beim ersten Start eins aus
      # OPELBRIDGE_TOKEN: bitte-hier-ein-langes-geheimnis
      OPELBRIDGE_POLL: "300"
